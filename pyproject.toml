[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oxmemory"
version = "1.0.0"
description = "Cross-LLM memory layer for AI agents - local, human-editable, Git-native"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "0xMemory Team" }
]
keywords = ["mcp", "llm", "memory", "ai", "agent", "claude", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Phase 2: Vector search
vector = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
# Phase 3: Knowledge extraction
extraction = [
    "litellm>=1.0.0",
]
# Phase 4: HTTP transport
http = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]
# All features
all = [
    "oxmemory[vector,extraction,http]",
]
# Development
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
"0xmemory" = "oxmemory.cli.main:app"
"oxmemory" = "oxmemory.cli.main:app"

[project.urls]
Homepage = "https://github.com/MANOJ-80/0xMemory"
Repository = "https://github.com/MANOJ-80/0xMemory"
Documentation = "https://github.com/MANOJ-80/0xMemory#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/oxmemory"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
