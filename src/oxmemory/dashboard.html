<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>0xMemory · Project memory</title>
<style>
:root{font:16px system-ui;color:#e3e9f4;background:#10151f}body{max-width:1060px;margin:40px auto;padding:0 20px}
h1{letter-spacing:-1px}p{color:#aab6c8;line-height:1.6}input,textarea,button,select{font:inherit;padding:10px;border:1px solid #39455b;border-radius:6px;background:#192332;color:inherit}
button{cursor:pointer;background:#233f59}button:hover{background:#305674}button:disabled{opacity:.5;cursor:wait}
form,.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}input{flex:1;min-width:150px}textarea{width:95%;min-height:65px}
article{border:1px solid #334259;border-radius:10px;padding:20px;margin:15px 0;background:#151f2d}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}summary{cursor:pointer;color:#9fcfe7}small{color:#aab6c8}
.badge{font-size:12px;border-radius:20px;padding:5px 10px;background:#28493e}.stale{background:#634e21}.superseded{background:#454057}
#message{white-space:pre-wrap;overflow-wrap:anywhere;color:#f3d089}label{display:block;margin:10px 0}
</style>
<h1>0xMemory <small>/ project memory</small></h1>
<p>Inspect current decisions, trace their evidence, and review memories affected by code changes.</p>
<div class="toolbar"><button id="reload">All memories</button><button id="observe">Check latest commit</button>
<select id="status" aria-label="Filter status"><option value="">Every state</option><option>active</option><option>stale</option><option>superseded</option></select></div>
<form id="search"><input id="query" placeholder="What does the agent need to know?" aria-label="Query" required>
<input id="file" placeholder="Relevant file (optional)" aria-label="Relevant file"><button>Recall</button></form>
<p id="message" role="status" aria-live="polite"></p><section id="list"></section>
<script>
const $=id=>document.getElementById(id);let entries=[];
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function node(tag,text){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n}
function show(){const list=$('list');list.replaceChildren();for(const m of entries){if($('status').value&&m.status!==$('status').value)continue;
const card=node('article'),badge=node('span',m.status);badge.className='badge '+m.status;card.append(badge,node('h3',m.content),node('small',m.id+' · '+m.type));
card.append(node('p','Evidence: '+(m.file_paths.join(', ')||'No linked files')+' · '+(m.commit_sha||'No commit recorded')));
if(m.reasons)card.append(node('p','Retrieved because: '+m.reasons.join(', ')));
if(m.verification_note)card.append(node('p',m.verification_note));
const details=node('details');details.append(node('summary','Evidence and revision history'),node('pre',JSON.stringify(m,null,2)));card.append(details);
if(m.status!=='superseded'){const review=node('details');review.append(node('summary','Review this decision'));const form=node('form');form.style.display='block';
const note=node('input');note.placeholder='What did you verify in the code?';note.required=true;note.setAttribute('aria-label','Verification note');
const commit=node('input');commit.value='HEAD';commit.setAttribute('aria-label','Evidence commit');
const text=node('textarea');text.placeholder='Replacement decision (leave empty to retain current decision)';text.setAttribute('aria-label','Replacement decision');
const paths=node('input');paths.value=m.file_paths.join(', ');paths.setAttribute('aria-label','Replacement evidence files');
const label=node('label');label.append(node('span','After reviewing the code, record your assessment. File existence alone does not prove a decision.'));
const submit=node('button','Save review');form.append(label,note,commit,text,paths,submit);
form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const body={note:note.value,commit:commit.value};if(text.value.trim()){body.content=text.value;body.file_paths=paths.value.split(',').map(x=>x.trim()).filter(Boolean)}await api('/api/memories/'+encodeURIComponent(m.id)+'/review',body);await load();$('message').textContent='Review saved; history preserved.'}catch(e){$('message').textContent=e.message}finally{submit.disabled=false}};review.append(form);card.append(review)}list.append(card)}if(!list.children.length)list.append(node('p','No memories match this view.'))}
async function load(){entries=await api('/api/memories');show();$('message').textContent=entries.length+' memories'}
$('reload').onclick=()=>load().catch(e=>$('message').textContent=e.message);$('status').onchange=show;
$('observe').onclick=async()=>{try{const r=await api('/api/observe',{commit:'HEAD'});await load();$('message').textContent=r.affected.length+' memories need verification at '+r.commit}catch(e){$('message').textContent=e.message}};
$('search').onsubmit=async e=>{e.preventDefault();try{const r=await api('/api/recall?'+new URLSearchParams({query:$('query').value,file:$('file').value,history:$('status').value!=='active'&&$('status').value!==''}));entries=r.results.map(x=>({...x.memory,reasons:x.reasons}));show();$('message').textContent=r.results.length+' results; '+r.budget_used+' UTF-8 bytes of context (conservative budget proxy)'}catch(e){$('message').textContent=e.message}};
load().catch(e=>$('message').textContent=e.message);
</script></html>
